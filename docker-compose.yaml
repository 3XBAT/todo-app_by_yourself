services:
  todo-app:
    build : ./
    command:
    - /application # мы говорим, что надо запустить бинарь нашего приложения
    ports:
      - 8088:8088
    depends_on:
      - db
      - auth-grpc
    environment:
      - DB_PASSWORD=qwerty

  db:
    restart: no
    image: postgres:latest
    ports:
      - 5436:5432
    environment:
      - POSTGRES_PASSWORD=qwerty
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-grpc:
    build:
      context: C:\Users\xvati\GolandProjects\Auth\auth # Путь к репозиторию с gRPC-приложением
      dockerfile: Dockerfile
    ports:
      - "44044:44044"



